# Workflow = « Vérification ». Job requis = « test ».
name: Vérification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: azdak919/le-kiosque
          ref: 8d7b602f42f78f75cf441ec477bec43dae62b570
          path: .kiosque-pin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: PHP
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-gd
      - name: Unit / check
        run: npm test
        env:
          KIOSQUE_PIN_DIR: .kiosque-pin
      - name: Paquet PHP pour hébergement mutualisé
        run: node tools/paquet-php.mjs
      - name: Publier le paquet PHP (artefact)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: le-socle-php
          path: dist/le-socle-php.zip
          retention-days: 90
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 7

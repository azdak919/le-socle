# Page de présentation du Socle, sur GitHub Pages.
# Ne tourne que dans azdak919/le-socle.
#
# Avant la première publication : activer GitHub Pages dans les réglages du
# dépôt, source « GitHub Actions ». Sans cela, ce workflow échoue.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    if: github.repository == 'azdak919/le-socle'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url || steps.pages2.outputs.page_url || steps.pages3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # L'API Pages ne voit parfois pas encore l'artefact (« Found 0 artifact(s) »)
      # juste après l'envoi. Deux nouveaux essais, avec une pause. Chaque run
      # publie son propre SHA ; la concurrence annule un run plus ancien.
      - id: pages
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Pause avant un nouvel essai
        if: steps.pages.outcome == 'failure'
        run: sleep 30
      - id: pages2
        if: steps.pages.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Pause avant le dernier essai
        if: steps.pages2.outcome == 'failure'
        run: sleep 30
      - id: pages3
        if: steps.pages2.outcome == 'failure'
        uses: actions/deploy-pages@v5
